<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>K.A.B cosmetics — косметика, парфюм и бижутерия в Чирчике (демо)</title>
<meta name="description" content="Демо-версия интернет-магазина K.A.B cosmetics: каталог, корзина, доставка и онлайн-оплата.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbf7f5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../fa/all.min.css">
<style>
:root{--bg:#fbf7f5;--ink:#1d1719;--muted:#7d7175;--pink:#e2789a;--pink-dk:#c95479;--pink-lt:#f8dbe3;--blush:#fdeef2;--gold:#c9a46a;--line:#efe5e7;--card:#fff;--ok:#2e9e6b;--r:20px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;line-height:1.55;overflow-x:hidden}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img,svg{display:block;max-width:100%}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 26px;border-radius:999px;font-weight:700;font-size:15px;transition:transform .15s,background .2s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#000;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
.btn-pink{background:var(--pink);color:#fff}
.btn-pink:hover{background:var(--pink-dk)}
.btn-line{border:1.5px solid var(--ink)}
.btn-line:hover{background:var(--ink);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}

/* demo strip */
.demo{background:var(--ink);color:#e9dfe2;font-size:12.5px;text-align:center;padding:9px 14px;line-height:1.4}
.demo a{color:#fff;font-weight:700;text-decoration:underline;text-underline-offset:3px;margin:0 6px;white-space:nowrap}
.ann{background:var(--pink-lt);color:#7a3550;font-size:13px;font-weight:600;text-align:center;padding:9px 14px}
.ann i{margin-right:6px}

/* header */
header{position:sticky;top:0;z-index:40;background:rgba(251,247,245,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{height:72px;display:flex;align-items:center;gap:28px}
.logo{display:flex;flex-direction:column;line-height:1}
.logo b{font:700 30px 'Cormorant Garamond',serif;letter-spacing:.04em}
.logo b span{color:var(--pink)}
.logo small{font-size:9px;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);margin-top:3px;padding-left:2px}
.links{display:flex;gap:24px;font-size:14px;font-weight:600;color:#4b4246}
.links a{position:relative;padding:6px 0}
.links a::after{content:"";position:absolute;left:0;right:100%;bottom:0;height:2px;background:var(--pink);transition:right .25s}
.links a:hover::after{right:0}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:#fff}
.lang button{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;color:var(--muted)}
.lang button.on{background:var(--ink);color:#fff}
.icon{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:18px;transition:background .2s}
.icon:hover{background:#fff}
#favBtn i{color:#9a8d91}
.icon em{position:absolute;top:3px;right:2px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--pink);color:#fff;font:800 11px/19px 'Manrope';font-style:normal;text-align:center}
.icon em:empty{display:none}
.burger{display:none}
@media (max-width:940px){.links{display:none}.burger{display:grid}}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center;padding-top:56px;padding-bottom:40px}
.kicker{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--pink-dk)}
.kicker i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(46,158,107,.15)}
.hero h1{font:600 clamp(46px,6.2vw,82px)/.98 'Cormorant Garamond',serif;letter-spacing:-.01em;margin:20px 0 18px}
.hero h1 em{font-style:italic;color:var(--pink)}
.hero p.lead{font-size:17px;color:#5d5357;max-width:470px}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.facts{display:flex;gap:30px;margin-top:34px;flex-wrap:wrap}
.facts b{display:block;font:700 28px 'Cormorant Garamond',serif}
.facts span{font-size:13px;color:var(--muted)}
.stage{position:relative;aspect-ratio:1/1.02;max-width:540px;justify-self:end;width:100%}
.arch{position:absolute;inset:6% 8% 0;border-radius:260px 260px 28px 28px;background:linear-gradient(160deg,#fbe1e8,#f3c3d1 55%,#eab0c2);overflow:hidden}
.arch::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.7),transparent 45%)}
.hp{position:absolute;filter:drop-shadow(0 18px 24px rgba(120,40,70,.18));animation:float 6s ease-in-out infinite}
.hp:nth-of-type(2){animation-delay:-2s}.hp:nth-of-type(3){animation-delay:-4s}
@keyframes float{50%{transform:translateY(-12px)}}
.chipf{z-index:3;position:absolute;background:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 16px 40px -12px rgba(80,30,50,.25);display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700}
.chipf i{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--blush);color:var(--pink-dk);font-size:16px}
.chipf small{display:block;font-weight:500;color:var(--muted);font-size:12px}
@media (max-width:860px){.hero{grid-template-columns:1fr;padding-top:30px;padding-bottom:10px;gap:20px}.stage{justify-self:center;max-width:420px}.chipf{font-size:12px;padding:10px 12px}.chipf.l{left:0!important}.chipf.r{right:0!important}}

/* perks */
.perks{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px;margin-bottom:10px}
.perk{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}
.perk i{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--blush);color:var(--pink-dk);font-size:19px}
.perk b{display:block;font-size:14.5px}
.perk span{font-size:12.5px;color:var(--muted)}
@media (max-width:900px){.perks{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.perks{grid-template-columns:1fr}}

section{padding-top:56px;padding-bottom:56px}
.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.head h2{font:600 clamp(34px,4.4vw,52px)/1 'Cormorant Garamond',serif}
.head h2 em{font-style:italic;color:var(--pink)}
.head p{color:var(--muted);max-width:420px}

/* categories */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.cat{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:4/5;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;isolation:isolate;transition:transform .3s}
.cat:hover{transform:translateY(-6px)}
.cat .bgart{position:absolute;inset:0;z-index:-1;display:grid;place-items:center;padding:18% 18% 30%}
.cat::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(transparent 45%,rgba(29,23,25,.55))}
.cat b{font:600 30px 'Cormorant Garamond',serif;line-height:1}
.cat span{font-size:13px;opacity:.9;margin-top:4px}
@media (max-width:900px){.cats{grid-template-columns:1fr 1fr}}

/* catalogue */
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 18px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:700;color:#5d5357;transition:.2s}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 18px}
.search input{flex:1;border:0;outline:0;padding:12px 0;background:none;font-size:14px}
.search i{color:var(--muted)}
select.sort{border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 16px;font-size:14px;font-weight:600;outline:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media (max-width:1040px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:720px){.grid{grid-template-columns:1fr 1fr;gap:12px}}
.card{position:relative;background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
@media (hover:hover){.card:hover{transform:translateY(-4px);box-shadow:0 22px 40px -22px rgba(80,30,50,.35)}}
.pic{position:relative;aspect-ratio:1/1;cursor:pointer;display:grid;place-items:center;padding:12%}
.pic svg{transition:transform .4s}
@media (hover:hover){.card:hover .pic svg{transform:scale(1.06) rotate(-2deg)}}
.badge{position:absolute;top:12px;left:12px;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.02em;background:#fff;color:var(--ink)}
.badge.hit{background:var(--ink);color:#fff}.badge.new{background:#fff;color:var(--ok)}.badge.sale{background:var(--pink);color:#fff}
.badge.premium{background:linear-gradient(110deg,#a7834f,#f1dfba,#a7834f);color:#3a2a1a}.badge.gift{background:#fff;color:var(--pink-dk)}
.fav{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;font-size:16px;color:#9a8d91}
.fav.on{color:var(--pink)}
.out{position:absolute;inset:auto 12px 12px;padding:6px;border-radius:10px;background:rgba(29,23,25,.75);color:#fff;font-size:12px;font-weight:700;text-align:center}
.info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:3px;flex:1}
.info .sub{font-size:12px;color:var(--muted)}
.info h3{font-size:15px;font-weight:700;line-height:1.3;cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px}
.price b{font-size:16px;font-weight:800}
.price s{display:block;font-size:12px;color:var(--muted)}
.add{flex:none;width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;font-size:16px;display:grid;place-items:center;transition:background .2s,transform .15s}
.add:hover{background:var(--pink)}
.add:active{transform:scale(.9)}
.empty{grid-column:1/-1;text-align:center;padding:50px 0;color:var(--muted)}

/* gift banner */
.promo{display:grid;grid-template-columns:1.2fr 1fr;align-items:center;border-radius:32px;overflow:hidden;background:linear-gradient(120deg,#2a1f23,#43303a);color:#fff}
.promo .t{padding:48px}
.promo h2{font:600 clamp(36px,4vw,54px)/1 'Cormorant Garamond',serif}
.promo h2 em{font-style:italic;color:#f4b6c8}
.promo p{color:#d7c9ce;margin:14px 0 24px;max-width:420px}
.code{display:inline-flex;gap:10px;align-items:center;border:1.5px dashed #f4b6c8;border-radius:12px;padding:10px 16px;font-weight:800;letter-spacing:.08em;margin-right:12px}
.promo .art{padding:30px;display:grid;place-items:center;background:radial-gradient(circle,#5a3e4a,transparent 70%)}
@media (max-width:760px){.promo{grid-template-columns:1fr}.promo .t{padding:30px}.promo .art{order:-1;padding:24px 60px 0}}

/* delivery */
.info2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.box{background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px}
.box h3{font:600 28px 'Cormorant Garamond',serif;margin-bottom:14px;display:flex;gap:12px;align-items:center}
.box h3 i{font-size:18px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--blush);color:var(--pink-dk)}
.zl{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line);font-size:14px}
.zl:last-child{border:0}
.zl small{display:block;color:var(--muted);font-size:12.5px}
.zl b{white-space:nowrap}
.pays{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.pay{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;border:1px solid var(--line);font-weight:700;font-size:14px;background:var(--bg)}
.pay i{color:var(--pink-dk)}
@media (max-width:760px){.info2{grid-template-columns:1fr}}

/* insta + contacts */
.insta{text-align:center;background:var(--blush);border-radius:32px;padding:46px 24px}
.insta h2{font:600 clamp(32px,4vw,48px)/1.05 'Cormorant Garamond',serif;margin:12px 0}
.insta p{color:#6d5c62;margin-bottom:22px}
.insta .ic{font-size:30px;color:var(--pink-dk)}
footer{background:var(--ink);color:#cfc3c7;padding:50px 0 30px;margin-top:40px}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:30px}
footer .logo b{color:#fff}
footer h4{color:#fff;font-size:14px;margin-bottom:12px}
footer li{list-style:none;font-size:14px;margin-bottom:8px}
footer li i{width:20px;color:var(--pink)}
.copy{border-top:1px solid #3a3034;margin-top:34px;padding-top:20px;font-size:12.5px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.copy a{color:#fff;text-decoration:underline}
@media (max-width:820px){.fgrid{grid-template-columns:1fr 1fr}}

/* overlays */
.shade{position:fixed;inset:0;z-index:60;background:rgba(29,23,25,.45);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
.shade.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:70;width:min(440px,100%);background:var(--bg);transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line)}
.dh h3{font:600 28px 'Cormorant Garamond',serif}
.close{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:16px}
.db{flex:1;overflow-y:auto;padding:16px 22px}
.df{padding:18px 22px 22px;border-top:1px solid var(--line);background:#fff}
.ci{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.ci .p{width:76px;height:76px;border-radius:16px;display:grid;place-items:center;padding:8px}
.ci h4{font-size:14px;line-height:1.3}
.ci small{color:var(--muted);font-size:12px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:#fff;margin-top:6px}
.qty button{width:32px;height:32px;font-size:15px;font-weight:700}
.qty span{min-width:22px;text-align:center;font-weight:800;font-size:14px}
.rm{color:#b0a3a7;font-size:14px;align-self:start;padding:4px}
.sumrow{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;color:#5d5357}
.sumrow.tot{font-size:18px;font-weight:800;color:var(--ink);margin:10px 0 14px}
.freebar{background:var(--blush);border-radius:14px;padding:12px 14px;font-size:13px;margin-bottom:12px}
.freebar .tr{height:6px;border-radius:9px;background:#f3cbd7;margin-top:8px;overflow:hidden}
.freebar .tr i{display:block;height:100%;background:var(--pink);border-radius:9px;transition:width .4s}
.promo-in{display:flex;gap:8px;margin-bottom:10px}
.promo-in input{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 14px;outline:0;text-transform:uppercase}
.promo-in button{padding:0 16px;border-radius:12px;background:var(--blush);font-weight:700;color:var(--pink-dk)}

.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;pointer-events:none}
.mbox{pointer-events:auto;width:min(920px,100%);max-height:calc(100vh - 32px);overflow-y:auto;background:var(--bg);border-radius:28px;position:relative;opacity:0;transform:translateY(24px) scale(.98);transition:.3s cubic-bezier(.2,.8,.2,1);box-shadow:0 40px 90px -30px rgba(0,0,0,.5)}
.modal.on .mbox{opacity:1;transform:none}
.modal:not(.on) .mbox{pointer-events:none}
.mbox>.close{position:absolute;top:14px;right:14px;z-index:2}
.pm{display:grid;grid-template-columns:1fr 1fr}
.pm .big{display:grid;place-items:center;padding:12%;border-radius:28px 0 0 28px;min-height:420px}
.pm .tx{padding:40px 34px 32px}
.pm h2{font:600 40px/1.05 'Cormorant Garamond',serif;margin:8px 0}
.pm .desc{color:#5d5357;margin:12px 0 20px}
.lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.vars{display:flex;gap:8px;flex-wrap:wrap}
.var{padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;font-size:14px;background:#fff}
.var.on{border-color:var(--ink)}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--ink)}
.pm .buy{display:flex;gap:12px;align-items:center;margin-top:26px}
.pm .bigp{font-size:26px;font-weight:800}
.pm .bigp s{font-size:15px;color:var(--muted);font-weight:500;margin-left:8px}
.stock{font-size:13px;font-weight:700;margin-top:10px}
.stock.yes{color:var(--ok)}.stock.no{color:#b5473a}
@media (max-width:760px){.pm{grid-template-columns:1fr}.pm .big{border-radius:28px 28px 0 0;min-height:0;padding:14% 24%}.pm .tx{padding:24px 22px 26px}}

/* checkout */
.co{padding:34px}
.co h2{font:600 38px 'Cormorant Garamond',serif;margin-bottom:6px}
.steps{display:flex;gap:6px;margin-bottom:24px;font-size:12.5px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.steps span{display:flex;align-items:center;gap:6px}
.steps span::after{content:"›";margin-left:6px;color:#cbbfc3}
.steps span:last-child::after{content:""}
.cog{display:grid;grid-template-columns:1.35fr 1fr;gap:24px}
.fs{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:16px}
.fs h4{font-size:15px;margin-bottom:14px;display:flex;gap:10px;align-items:center}
.fs h4 b{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:#5d5357}
.fld input,.fld textarea,.fld select{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;outline:0;background:var(--bg);font-weight:500;font-size:15px;color:var(--ink);transition:border-color .2s}
.fld input:focus,.fld textarea:focus{border-color:var(--pink)}
.fld.err input{border-color:#d0574a}
.fld .e{color:#d0574a;font-size:12px;font-weight:600;display:none}
.fld.err .e{display:block}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;background:var(--bg);transition:border-color .2s}
.opt.on{border-color:var(--ink);background:#fff}
.opt input{accent-color:var(--ink);width:18px;height:18px}
.opt .t{flex:1;font-size:14px;font-weight:700}
.opt .t small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.opt .v{font-weight:800;font-size:14px;white-space:nowrap}
.plogo{min-width:72px;height:30px;border-radius:8px;display:grid;place-items:center;font:800 13px 'Manrope';color:#fff;padding:0 10px}
.side{position:sticky;top:0}
.mini{display:flex;gap:10px;align-items:center;font-size:13px;padding:8px 0;border-bottom:1px dashed var(--line)}
.mini .p{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;padding:4px;flex:none}
.mini span{flex:1}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } };

let lang = store('kab_lang') || 'ru';

const prod = id => cat_().find(p => p.id === id);
const tile = (p, i) => `background:radial-gradient(circle at 50% 38%,#fff 0%,${p.c[0]}66 55%,${p.c[0]}aa 100%)`;

/* ---------- rendering ---------- */

  document.documentElement.lang = lang;

  document.querySelectorAll('[data-ph]').forEach(el => el.placeholder = t(el.dataset.ph));
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  const C = cat_();
  $('cats').innerHTML = KAB.categories.map((c, i) => {
    const p = C.find(x => x.cat === c.id && x.badge === 'hit') || C.find(x => x.cat === c.id);
    const bg = ['linear-gradient(160deg,#f6c9d6,#e2789a)', 'linear-gradient(160deg,#d7ecf2,#7fb6c9)', 'linear-gradient(160deg,#f3d6cc,#c98e74)', 'linear-gradient(160deg,#efe6d6,#c9a46a)'][i];
    return `<a href="#catalog" class="cat" data-cat="${c.id}" style="background:${bg}"><div class="bgart"><div class="ill">${KAB.art(p.art, p.c[0], p.c[1], 'cat' + i)}</div>${KAB.scene(KAB.SCENE.cats[c.id], 600, 750)}</div><b>${c[lang]}</b><span>${C.filter(x => x.cat === c.id && !x.hidden).length} ${t('items')}</span></a>`;

  $('sort').innerHTML = [['pop', 'sortPop'], ['cheap', 'sortCheap'], ['exp', 'sortExp'], ['new', 'sortNew']].map(([v, k]) => `<option value="${v}"${v === sortBy ? ' selected' : ''}>${t(k)}</option>`).join('');

  $('h2art').innerHTML = KAB.art('perfume', C2[0].c[0], C2[0].c[1], 'h2');
  $('h3art').innerHTML = KAB.art('jar', '#fff4f6', '#f2a7ba', 'h3');
  $('promoArt').innerHTML = `<div style="position:relative;width:min(340px,100%);aspect-ratio:1;border-radius:26px;overflow:hidden;display:grid;place-items:center;padding:10%">${KAB.pic(prod(20), 700)}</div>`;
  $('arch').innerHTML = `<img class="ph" src="${KAB.photo(KAB.SCENE.hero, 900, 1100)}" alt="" onload="this.closest('.stage').classList.add('photo')" onerror="this.remove()">`;
  const hp = prod(1);
  $('hcard').innerHTML = `<div class="p" style="${tile(hp)}">${KAB.pic(hp, 160)}</div><div><small>${t('hitWeek')}</small><b>${esc(hp.name[lang])}</b><span>${fmt(hp.price)}</span></div>`;
  $('hcard').dataset.open = hp.id;
  $('ig').innerHTML = KAB.SCENE.insta.map(id => `<a href="https://instagram.com/k.a.b_cosmetics" target="_blank" rel="noopener" aria-label="Instagram">${KAB.scene(id, 400, 400)}</a>`).join('');
  $('dealGrid').innerHTML = cat_().filter(p => !p.hidden && (p.old || p.badge === 'gift')).slice(0, 3).map(cardHTML).join('');
  tick();
  renderGrid(); renderBadges();
}

function renderGrid(){
  let L = cat_().filter(p => !p.hidden && (cat === 'all' || p.cat === cat));
  if (query) { const q = query.toLowerCase(); L = L.filter(p => (p.name.ru + ' ' + p.name.uz + ' ' + p.sub.ru + ' ' + p.sub.uz).toLowerCase().includes(q)); }
  const rank = { hit: 0, premium: 1, sale: 2, new: 3, gift: 4 };
  if (sortBy === 'cheap') L.sort((a, b) => a.price - b.price);
  else if (sortBy === 'exp') L.sort((a, b) => b.price - a.price);
  else if (sortBy === 'new') L.sort((a, b) => (b.badge === 'new') - (a.badge === 'new'));
  else L.sort((a, b) => (rank[a.badge] ?? 9) - (rank[b.badge] ?? 9));
  L.sort((a, b) => (a.stock <= 0) - (b.stock <= 0));
  $('grid').innerHTML = L.length ? L.map(cardHTML).join('') : `<div class="empty">${t('nothing')}</div>`;
}
function cardHTML(p){
  return `
    <article class="card">
      <div class="pic" data-open="${p.id}" style="${tile(p)}">${KAB.pic(p, 600)}
        ${p.badge ? `<span class="badge ${p.badge}">${p.badge === 'sale' && p.old ? '−' + Math.round(100 - p.price / p.old * 100) + '%' : t(p.badge)}</span>` : ''}
        ${p.stock <= 0 ? `<span class="out">${t('outStock')}</span>` : ''}
      </div>
      <button class="fav${favs.includes(p.id) ? ' on' : ''}" data-fav="${p.id}" aria-label="favourite"><i class="fa-solid fa-heart"></i></button>
      <div class="info">
        <span class="sub">${esc(p.sub[lang])}</span>
        <h3 data-open="${p.id}">${esc(p.name[lang])}</h3>
        <div class="row"><div class="price">${p.old ? `<s>${fmt(p.old)}</s>` : ''}<b>${p.variants ? (lang === 'uz' ? '' : 'от ') : ''}${fmt(p.variants ? Math.min(...p.variants.map(v => v.price)) : p.price)}${p.variants && lang === 'uz' ? 'dan' : ''}</b></div>
        <button class="add" data-quick="${p.id}" aria-label="${t('addCart')}"${p.stock <= 0 ? ' disabled style="opacity:.3"' : ''}><i class="fa-solid fa-plus"></i></button></div>
      </div>
    </article>`;
}

function renderBadges(){
  $('cartN').textContent = $('cartN2').textContent = cart.reduce((a, i) => a + i.q, 0) || '';
  $('favN').textContent = $('favN2').textContent = favs.length || '';
}

/* ---------- product modal ---------- */
let pv = 0, psh = 0, pq = 1, pid = 0, pimg = 0, ptab = 'desc';
function openProduct(id){
  pid = id; const p = prod(id); pv = p.variants ? Math.min(1, p.variants.length - 1) : 0; psh = 0; pq = 1; pimg = 0; ptab = 'desc';
  drawProduct(); openModal('pModal');
}
function drawProduct(){
  const p = prod(pid); const price = p.variants ? p.variants[pv].price : p.price;
  $('pBody').innerHTML = `<div class="pm">

      ${p.img ? `<div class="thumbs">${[0, 1, 2].map(i => `<button class="${i === pimg ? 'on' : ''}" data-pimg="${i}" aria-label="photo ${i + 1}" style="${i === 2 ? tile(p) : ''}">${i === 2 ? KAB.art(p.art, p.c[0], p.shades ? p.shades[psh] : p.c[1], 'th' + p.id) : KAB.pic(p, 120, i ? 1.8 : 0)}</button>`).join('')}</div>` : ''}</div>

      <h2>${esc(p.name[lang])}</h2><div style="color:var(--muted)">${esc(p.sub[lang])}</div>
      <div class="ptabs">${[['desc', 'tabDesc'], ['use', 'tabUse'], ['del', 'tabDel']].map(([k, n]) => `<button data-ptab="${k}" class="${ptab === k ? 'on' : ''}">${t(n)}</button>`).join('')}</div>

      <div class="stock ${p.stock > 0 ? 'yes' : 'no'}">${p.stock > 0 ? `<i class="fa-solid fa-circle-check"></i> ${t('inStock')}${p.stock <= 5 ? ` · ${t('left')} ${p.stock}` : ''}` : `<i class="fa-solid fa-circle-xmark"></i> ${t('outStock')}`}</div>
      <div class="buy">

      </div>
      <div class="buy">
        <div class="qty"><button data-pq="-1">−</button><span>${pq}</span><button data-pq="1">+</button></div>
        <button class="btn btn-dark" style="flex:1" id="pAdd"${p.stock <= 0 ? ' disabled' : ''}><i class="fa-solid fa-bag-shopping"></i>${t('addCart')}</button>
        <button class="icon" style="border:1px solid var(--line);background:#fff" data-fav="${p.id}"><i class="fa-solid fa-heart" style="color:${favs.includes(p.id) ? 'var(--pink)' : '#c9bec2'}"></i></button>

    </div></div>`;

/* ---------- cart ---------- */
function addToCart(id, v = 0, sh = 0, q = 1){
  const p = prod(id); if (!p || p.stock <= 0) return;
  if (p.variants && v === null) v = Math.min(1, p.variants.length - 1);
  const it = cart.find(i => i.id === id && i.v === v && i.sh === sh);
  if (it) it.q = Math.min(it.q + q, p.stock); else cart.push({ id, v, sh, q: Math.min(q, p.stock) });
  store('kab_cart', cart); renderBadges(); toast(t('added'));
  const b = $('cartBtn'); b.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 400 });
}
const lineName = i => { const p = prod(i.id); return p.name[lang] + (p.variants ? ' · ' + p.variants[i.v][lang] : '') + (p.shades ? ` · ${t('shade').toLowerCase()} ${i.sh + 1}` : ''); };
const linePrice = i => { const p = prod(i.id); return p.variants ? p.variants[i.v].price : p.price; };
function totals(zoneId){
  const sub = cart.reduce((a, i) => a + linePrice(i) * i.q, 0);
  const disc = promo ? Math.round(sub * KAB.promo[promo] / 100 / 1000) * 1000 : 0;
  let ship = 0;
  if (zoneId){ const z = KAB.zoneList(S).find(x => x.id === zoneId); ship = z.free && sub - disc >= z.free ? 0 : z.price; }
  return { sub, disc, ship, total: sub - disc + ship };
}
function renderCart(){
  if (!cart.length){
    $('cartBody').innerHTML = `<div style="text-align:center;padding:60px 10px"><div style="font-size:46px;color:var(--pink-lt)"><i class="fa-solid fa-bag-shopping"></i></div><h4 style="font:600 26px 'Cormorant Garamond',serif;margin:12px 0 4px">${t('cartEmpty')}</h4><p style="color:var(--muted)">${t('cartEmptyS')}</p><a href="#catalog" class="btn btn-dark" data-close style="margin-top:20px">${t('toCatalog')}</a></div>`;
    $('cartFoot').innerHTML = ''; return;
  }
  $('cartBody').innerHTML = cart.map((i, k) => { const p = prod(i.id); return `<div class="ci">
    <div class="p" style="${tile(p)}">${KAB.pic(p, 160, 0, p.shades ? p.shades[i.sh] : 0)}</div>
    <div><h4>${esc(lineName(i))}</h4><small>${fmt(linePrice(i))}</small><br><div class="qty"><button data-cq="${k}:-1">−</button><span>${i.q}</span><button data-cq="${k}:1">+</button></div></div>
    <div style="text-align:right"><button class="rm" data-rm="${k}" aria-label="remove"><i class="fa-solid fa-xmark"></i></button><div style="font-weight:800;margin-top:22px">${fmt(linePrice(i) * i.q)}</div></div></div>`; }).join('');
  const ups = cat_().filter(p => !p.hidden && p.stock > 0 && !p.variants && !p.shades && !cart.some(i => i.id === p.id)).sort((a, b) => a.price - b.price).slice(0, 3);
  if (ups.length) $('cartBody').innerHTML += `<div class="ups"><h5>${t('upsell')}</h5><div class="l">${ups.map(p => `<div class="u"><button class="add" data-quick="${p.id}" aria-label="+"><i class="fa-solid fa-plus"></i></button><div class="p" style="${tile(p)}">${KAB.pic(p, 200)}</div><b>${esc(p.name[lang])}</b>${fmt(p.price)}</div>`).join('')}</div></div>`;
  const tt = totals(); const z = KAB.zoneList(S).find(x => x.id === 'chirchiq'); const left = Math.max(0, z.free - (tt.sub - tt.disc));
  $('cartFoot').innerHTML = `
    <div class="freebar">${left ? `${t('freeLeft')} <b>${fmt(left)}</b>` : t('freeYes')}<div class="tr"><i style="width:${Math.min(100, (tt.sub - tt.disc) / z.free * 100)}%"></i></div></div>
    <div class="promo-in"><input id="promoIn" placeholder="${t('promoPh')}" value="${promo || ''}"><button id="promoBtn">${t('apply')}</button></div>
    <div class="sumrow"><span>${t('subtotal')}</span><span>${fmt(tt.sub)}</span></div>
    ${tt.disc ? `<div class="sumrow" style="color:var(--ok)"><span>${t('discount')} (${promo})</span><span>−${fmt(tt.disc)}</span></div>` : ''}
    <div class="sumrow tot"><span>${t('total')}</span><span>${fmt(tt.sub - tt.disc)}</span></div>
    <button class="btn btn-dark" style="width:100%" id="toCheckout">${t('checkout')}<i class="fa-solid fa-arrow-right"></i></button>`;
}
function renderFavs(){
  const L = favs.map(prod).filter(Boolean);
  $('cartBody').innerHTML = L.length ? L.map(p => `<div class="ci"><div class="p" style="${tile(p)}">${KAB.pic(p, 160)}</div>
    <div><h4>${esc(p.name[lang])}</h4><small>${fmt(p.price)}</small></div><button class="add" data-quick="${p.id}"><i class="fa-solid fa-plus"></i></button></div>`).join('')
    : `<p style="text-align:center;color:var(--muted);padding:60px 10px">${t('favEmpty')}</p>`;
  $('cartFoot').innerHTML = '';
}

/* ---------- checkout ---------- */
const co = { name: '', phone: '', zone: 'chirchiq', addr: '', comment: '', pay: 'payme' };
function openCheckout(){ closeAll(); drawCheckout(); openModal('coModal'); }
function drawCheckout(errs = {}){
  const tt = totals(co.zone); const Z = KAB.zoneList(S); const pay = KAB.payments.find(p => p.id === co.pay);
  const colors = { payme: '#00b7c2', click: '#0e74ff', uzum: '#7000ff' };
  $('coBody').innerHTML = `<div class="co">
    <h2>${t('coT')}</h2>
    <div class="steps"><span>1 · ${t('s1')}</span><span>2 · ${t('s2')}</span><span>3 · ${t('s3')}</span></div>
    <div class="cog"><div>
      <div class="fs"><h4><b>1</b>${t('s1')}</h4><div class="f2">
        <label class="fld${errs.name ? ' err' : ''}">${t('name')}<input id="fName" value="${esc(co.name)}" autocomplete="name"><span class="e">${t('req')}</span></label>
        <label class="fld${errs.phone ? ' err' : ''}">${t('phone')}<input id="fPhone" value="${esc(co.phone || '+998 ')}" inputmode="tel" autocomplete="tel"><span class="e">${t('badPhone')}</span></label>
      </div></div>
      <div class="fs"><h4><b>2</b>${t('s2')}</h4>
        ${Z.map(z => { const free = z.free && tt.sub - tt.disc >= z.free; return `<label class="opt${co.zone === z.id ? ' on' : ''}"><input type="radio" name="zone" value="${z.id}"${co.zone === z.id ? ' checked' : ''}>
          <span class="t">${z[lang]}<small>${z.days[lang]}${z.free && !free ? ` · ${t('freeFrom')} ${fmt(z.free)}` : ''}</small></span><span class="v">${!z.price || free ? t('free') : fmt(z.price)}</span></label>`; }).join('')}
        ${co.zone !== 'pickup' ? `<label class="fld${errs.addr ? ' err' : ''}" style="margin-top:10px">${t('addrF')}<input id="fAddr" value="${esc(co.addr)}" placeholder="${t('addrPh')}"><span class="e">${t('req')}</span></label>` : ''}
        <label class="fld" style="margin-top:10px">${t('comment')}<textarea id="fComment" rows="2" placeholder="${t('commentPh')}">${esc(co.comment)}</textarea></label>
      </div>
      <div class="fs"><h4><b>3</b>${t('s3')}</h4>
        <div class="lbl" style="margin-top:0">${t('payOnline')}</div>
        ${KAB.payments.filter(p => p.online).map(p => `<label class="opt${co.pay === p.id ? ' on' : ''}"><input type="radio" name="pay" value="${p.id}"${co.pay === p.id ? ' checked' : ''}><span class="t">${p.name}<small>Uzcard · Humo</small></span><span class="plogo" style="background:${colors[p.id]}">${p.name.split(' ')[0]}</span></label>`).join('')}
        <div class="lbl">${t('payLater')}</div>
        ${KAB.payments.filter(p => !p.online).map(p => `<label class="opt${co.pay === p.id ? ' on' : ''}"><input type="radio" name="pay" value="${p.id}"${co.pay === p.id ? ' checked' : ''}><span class="t">${p[lang]}</span><i class="fa-solid fa-${p.id === 'cash' ? 'money-bill-wave' : 'credit-card'}" style="color:var(--muted)"></i></label>`).join('')}
      </div>
    </div>
    <div><div class="fs side"><h4>${t('yourOrder')}</h4>
      ${cart.map((i, k) => { const p = prod(i.id); return `<div class="mini"><div class="p" style="${tile(p)}">${KAB.pic(p, 100, 0, p.shades ? p.shades[i.sh] : 0)}</div><span>${esc(lineName(i))} × ${i.q}</span><b>${fmt(linePrice(i) * i.q)}</b></div>`; }).join('')}
      <div style="margin-top:14px">
        <div class="sumrow"><span>${t('subtotal')}</span><span>${fmt(tt.sub)}</span></div>
        ${tt.disc ? `<div class="sumrow" style="color:var(--ok)"><span>${t('discount')} (${promo})</span><span>−${fmt(tt.disc)}</span></div>` : ''}
        <div class="sumrow"><span>${t('delivery')}</span><span>${tt.ship ? fmt(tt.ship) : t('free')}</span></div>
        <div class="sumrow tot"><span>${t('total')}</span><span>${fmt(tt.total)}</span></div>
      </div>
      <button class="btn btn-dark" style="width:100%" id="place">${pay.online ? `<i class="fa-solid fa-lock"></i>${t('placePay')}` : t('place')}</button>
      <p class="secure"><i class="fa-solid fa-shield-halved"></i>${t('agree')}</p>
    </div></div></div></div>`;
}
function readForm(){
  co.name = ($('fName') || {}).value?.trim() ?? co.name; co.phone = ($('fPhone') || {}).value?.trim() ?? co.phone;
  if ($('fAddr')) co.addr = $('fAddr').value.trim(); if ($('fComment')) co.comment = $('fComment').value.trim();
}
function placeOrder(){
  readForm();
  const errs = { name: !co.name, phone: co.phone.replace(/\D/g, '').length < 12, addr: co.zone !== 'pickup' && !co.addr };
  if (errs.name || errs.phone || errs.addr){ drawCheckout(errs); return; }
  const tt = totals(co.zone);
  S = KAB.load();
  const order = { no: S.nextNo++, at: Date.now(), name: co.name, phone: co.phone, zone: co.zone, address: co.zone === 'pickup' ? '' : co.addr, comment: co.comment,
    pay: co.pay, status: 'new', items: cart.map(i => ({ id: i.id, q: i.q, price: linePrice(i), name: lineName(i) })), sum: tt.sub, discount: tt.disc, ship: tt.ship, total: tt.total, promo };
  S.orders.push(order);
  cart.forEach(i => { const sp = S.products.find(x => x.id === i.id); if (sp) sp.stock = Math.max(0, sp.stock - i.q); });
  KAB.save(S);
  cart = []; promo = null; store('kab_cart', cart); renderBadges(); renderGrid();
  const pay = KAB.payments.find(p => p.id === order.pay);
  pay.online ? drawPayment(order) : drawSuccess(order);
}
function drawPayment(o){
  const pay = KAB.payments.find(p => p.id === o.pay); const colors = { payme: '#00b7c2', click: '#0e74ff', uzum: '#7000ff' };
  $('coBody').innerHTML = `<div class="paybox"><span class="plogo" style="background:${colors[pay.id]}">${pay.name}</span>
    <h2>${t('payGo')} #${o.no}</h2><div class="amt">${fmt(o.total)}</div>
    <div class="note"><i class="fa-solid fa-circle-info"></i> ${t('payDemo').replace('{p}', pay.name)}</div>
    <button class="btn btn-dark" style="width:100%" data-paid="${o.no}"><i class="fa-solid fa-lock"></i>${t('paySim')}</button>
    <button class="btn" style="width:100%;margin-top:8px;color:var(--muted)" data-unpaid="${o.no}">${t('payCancel')}</button></div>`;
}
function drawSuccess(o){
  const pay = KAB.payments.find(p => p.id === o.pay); const z = KAB.zones.find(x => x.id === o.zone);
  const msg = `🛍 ${t('tgNew')} #${o.no}${o.status === 'paid' ? ` — ✅ ${t('tgPaid')} (${pay.name})` : ` — ${t('tgUnpaid')}`}
👤 ${o.name}, ${o.phone}
📍 ${z[lang]}${o.address ? ', ' + o.address : ''}
${o.items.map(i => `• ${i.name} × ${i.q}`).join('\n')}
💰 ${fmt(o.total)}${o.comment ? '\n💬 ' + o.comment : ''}`;
  $('coBody').innerHTML = `<div class="paybox"><div class="ok"><i class="fa-solid fa-check"></i></div>
    <h2>${o.status === 'paid' ? t('okPaid') : t('okT')}</h2><p>${t('okS')} <b>#${o.no}</b>. ${t('okCall')}</p>
    <div class="tg"><div class="h"><i class="fa-brands fa-telegram"></i>K.A.B Orders Bot</div><div class="msg">${esc(msg)}</div></div>
    <p style="font-size:13px;margin:-8px 0 16px;color:var(--muted)">${t('okTg')}</p>
    <a class="btn btn-dark" style="width:100%" href="admin.html#order-${o.no}" target="_blank" rel="noopener"><i class="fa-solid fa-gauge-high"></i>${t('okAdmin')}</a>
    <button class="btn" style="width:100%;margin-top:8px" data-close>${t('okMore')}</button></div>`;
}

/* ---------- deal countdown ---------- */
function tick(){
  const now = new Date(), end = new Date(now); end.setDate(now.getDate() + ((7 - now.getDay()) % 7)); end.setHours(23, 59, 59, 999);
  let s = Math.max(0, Math.floor((end - now) / 1000));
  const parts = [[Math.floor(s / 86400), 'dd'], [Math.floor(s % 86400 / 3600), 'hh'], [Math.floor(s % 3600 / 60), 'mm'], [s % 60, 'ss']];
  $('cd').innerHTML = parts.map(([v, k]) => `<div><b>${String(v).padStart(2, '0')}</b><small>${t(k)}</small></div>`).join('');
}
setInterval(tick, 1000);

/* ---------- overlays ---------- */
function openModal(id){ $('shade').classList.add('on'); $(id).classList.add('on'); document.body.classList.add('lock'); }
function openDrawer(fav){ $('cart').querySelector('h3').textContent = fav ? t('favT') : t('cartT'); fav ? renderFavs() : renderCart(); $('shade').classList.add('on'); $('cart').classList.add('on'); document.body.classList.add('lock'); }
function closeAll(){ ['shade', 'cart', 'pModal', 'coModal', 'mnav'].forEach(id => $(id).classList.remove('on')); document.body.classList.remove('lock'); }
function toast(s){ const el = $('toast'); el.querySelector('span').textContent = s; el.classList.add('on'); clearTimeout(toast.tm); toast.tm = setTimeout(() => el.classList.remove('on'), 1900); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-pimg],[data-ptab],#cartBtn2,#favBtn2,[data-l],[data-open],[data-quick],[data-fav],[data-chip],[data-cat],[data-close],[data-v],[data-sh],[data-pq],[data-cq],[data-rm],[data-paid],[data-unpaid],#pAdd,#toCheckout,#promoBtn,#place,#cartBtn,#favBtn,#burger');
  if (!el) return;
  const d = el.dataset;
  if (d.pimg){ pimg = +d.pimg; drawProduct(); return; }
  if (d.ptab){ ptab = d.ptab; drawProduct(); return; }
  if (el.id === 'cartBtn2'){ openDrawer(false); return; }
  if (el.id === 'favBtn2'){ openDrawer(true); return; }
  if (d.l){ lang = d.l; store('kab_lang', lang); renderStatic(); return; }
  if (d.open){ e.preventDefault(); openProduct(+d.open); return; }
  if (d.quick){ const p = prod(+d.quick); if (p.variants || p.shades){ closeAll(); openProduct(p.id); } else addToCart(p.id); if ($('cart').classList.contains('on')) ($('cart').querySelector('h3').textContent === t('favT') ? renderFavs() : renderCart()); return; }
  if (d.fav){ const id = +d.fav; favs = favs.includes(id) ? favs.filter(x => x !== id) : [...favs, id]; store('kab_favs', favs); if (favs.includes(id)) toast(t('favAdded')); renderGrid(); renderBadges(); if ($('pModal').classList.contains('on')) drawProduct(); return; }
  if (d.chip){ cat = d.chip; renderStatic(); return; }
  if (d.cat){ cat = d.cat; closeAll(); renderStatic(); return; }
  if ('close' in d){ closeAll(); return; }
  if (d.v){ pv = +d.v; drawProduct(); return; }
  if (d.sh){ psh = +d.sh; pimg = 2; drawProduct(); return; }
  if (d.pq){ pq = Math.max(1, Math.min(prod(pid).stock || 1, pq + +d.pq)); drawProduct(); return; }
  if (el.id === 'pAdd'){ addToCart(pid, prod(pid).variants ? pv : 0, psh, pq); closeAll(); return; }
  if (d.cq){ const [k, dq] = d.cq.split(':').map(Number); const p = prod(cart[k].id); cart[k].q = Math.max(0, Math.min(p.stock, cart[k].q + dq)); if (!cart[k].q) cart.splice(k, 1); store('kab_cart', cart); renderCart(); renderBadges(); return; }
  if (d.rm){ cart.splice(+d.rm, 1); store('kab_cart', cart); renderCart(); renderBadges(); return; }
  if (el.id === 'promoBtn'){ const c = $('promoIn').value.trim().toUpperCase(); if (KAB.promo[c]){ promo = c; toast(t('promoOk')); } else { promo = null; toast(t('promoBad')); } renderCart(); return; }
  if (el.id === 'toCheckout'){ openCheckout(); return; }
  if (el.id === 'place'){ placeOrder(); return; }
  if (d.paid){ S = KAB.load(); const o = S.orders.find(x => x.no === +d.paid); o.status = 'paid'; KAB.save(S); drawSuccess(o); return; }
  if (d.unpaid){ S = KAB.load(); drawSuccess(S.orders.find(x => x.no === +d.unpaid)); return; }
  if (el.id === 'cartBtn'){ openDrawer(false); return; }
  if (el.id === 'favBtn'){ openDrawer(true); return; }
  if (el.id === 'burger'){ $('mnav').classList.add('on'); $('shade').classList.add('on'); return; }
});
document.addEventListener('change', e => {
  if (e.target.name === 'zone'){ readForm(); co.zone = e.target.value; drawCheckout(); }
  if (e.target.name === 'pay'){ readForm(); co.pay = e.target.value; drawCheckout(); }
  if (e.target.id === 'sort'){ sortBy = e.target.value; renderGrid(); }
});
document.addEventListener('input', e => {
  const f = e.target.closest('.fld.err'); if (f) f.classList.remove('err');
  if (e.target.id === 'q'){ query = e.target.value.trim(); renderGrid(); }
  if (e.target.id === 'fPhone'){ // +998 XX XXX XX XX
    let d = e.target.value.replace(/\D/g, ''); if (!d.startsWith('998')) d = '998' + d.replace(/^998/, ''); d = d.slice(0, 12);
    const p = [d.slice(0, 3), d.slice(3, 5), d.slice(5, 8), d.slice(8, 10), d.slice(10, 12)].filter(Boolean);
    e.target.value = '+' + p.join(' ');
  }
});
$('shade').addEventListener('click', closeAll);
addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });
addEventListener('storage', e => { if (e.key === KAB.KEY){ S = KAB.load(); renderStatic(); } });   // admin edits show up live
const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting){ x.target.classList.add('in'); io.unobserve(x.target); } }), { threshold: .12 });
document.querySelectorAll('.reveal').forEach(el => io.observe(el));

renderStatic();
</script>
</body>
</html>
