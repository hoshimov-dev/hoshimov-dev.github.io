<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ilhom Hoshimov</title>
<meta name="description" content="Веб-разработчик и основатель Nexus Card. Сайты для магазинов и NFC-визитки.">
<meta property="og:title" content="Ilhom Hoshimov — веб-разработчик">
<meta property="og:description" content="Сайты для магазинов и NFC-визитки. Чирчик · Ташкент.">
<meta name="theme-color" content="#080C0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Space+Grotesk:wght@500;600;700;800&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../fa/all.min.css">
<style>
:root{--green:#004d2d;--gold:#D4AF37;--gold-lt:#F3E5AB;--gold-dk:#997A15;--bg:#080C0A;--panel:rgba(20,30,25,.72);--text:#fff;--muted:#9aa59f;--line:rgba(212,175,55,.18)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{min-height:100vh;color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.5;overflow-x:hidden;
background:radial-gradient(ellipse 120% 60% at 50% -10%,rgba(0,77,45,.55),transparent 60%),radial-gradient(ellipse 80% 40% at 100% 100%,rgba(153,122,21,.18),transparent 60%),var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#dust{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:18px 18px 44px}
.gold{background:linear-gradient(110deg,var(--gold-dk),var(--gold) 30%,var(--gold-lt) 50%,var(--gold) 70%,var(--gold-dk));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-200% 0}}

.top{display:flex;justify-content:space-between;align-items:center}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(8,12,10,.6)}
.status i{width:7px;height:7px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 4px rgba(61,220,132,.15);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(61,220,132,0)}}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:rgba(8,12,10,.6)}
.lang button{font:600 11px 'Space Grotesk',sans-serif;padding:5px 10px;border-radius:999px;color:var(--muted)}
.lang button.on{background:var(--gold);color:#0b0b0b}

.hero{text-align:center;padding:34px 0 6px}
.ava{position:relative;width:138px;height:138px;margin:0 auto 20px}
.ava::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(from 0deg,var(--gold-dk),var(--gold-lt),var(--gold),var(--gold-dk),var(--gold-lt),var(--gold-dk));animation:spin 8s linear infinite}
.ava::after{content:"";position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.28),transparent 65%);z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
.ava div{position:absolute;inset:2px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#123a28,#060a08 75%) center/cover;display:grid;place-items:center;font:700 52px 'Playfair Display',serif}
h1{font:700 36px/1.1 'Playfair Display',serif;letter-spacing:.01em}
.role{margin-top:8px;font-size:15px;color:var(--gold-lt)}
.loc{margin-top:6px;font-size:13px;color:var(--muted)}
.loc i{color:var(--gold);margin-right:5px}
.bio{margin:16px auto 0;max-width:370px;font-size:15px;color:#d5dcd8;font-weight:300}

.cta{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:24px;padding:17px;border-radius:18px;font-weight:700;font-size:16px;color:#0b0b0b;
background:linear-gradient(110deg,var(--gold-dk),var(--gold) 35%,var(--gold-lt) 50%,var(--gold) 65%,var(--gold-dk));background-size:200% 100%;animation:shine 5s linear infinite;box-shadow:0 14px 34px -12px rgba(212,175,55,.6)}
.cta:active{transform:scale(.98)}

h2{display:flex;align-items:center;gap:10px;margin:30px 0 12px;font:600 11px 'Space Grotesk',sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.links{display:grid;gap:10px}
.lnk{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .2s,transform .15s}
.lnk:hover{border-color:rgba(212,175,55,.5)}
.lnk:active{transform:scale(.98)}
.lnk .ic{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:21px;color:#fff}
.lnk span{flex:1;font-weight:600;font-size:15px}
.lnk small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.lnk .go{color:var(--gold-dk);font-size:13px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(212,175,55,.06);font-size:13px;color:var(--gold-lt)}
.chip i{color:var(--gold);margin-right:6px}

.proj{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{display:block;border-radius:20px;transition:transform .15s,border-color .2s;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.pc:active{transform:scale(.97)}
.pc:hover{border-color:rgba(212,175,55,.5)}
.pc .cv{height:96px;display:grid;place-items:center;position:relative}
.pc .cv b{font-size:26px;transform:scale(.8)}
.pc .cv em{position:absolute;top:10px;left:10px;font:600 9px 'Space Grotesk';letter-spacing:.2em;text-transform:uppercase;font-style:normal;color:var(--gold);padding:4px 9px;border-radius:999px;background:rgba(8,12,10,.85);border:1px solid var(--line)}
.pc .bd{padding:10px 12px 12px}
.pc h3{font:600 14px 'Inter';line-height:1.25}
.pc p{font-size:12px;color:var(--muted);margin-top:2px}

.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px}
.row button{padding:15px;border-radius:16px;font-weight:600;display:flex;gap:9px;align-items:center;justify-content:center}
.save{background:#fff;color:#0b0b0b}
.share{border:1px solid var(--line);background:var(--panel)}
.brand{display:block;text-align:center;margin-top:34px;font-size:12px;color:var(--muted)}
.brand b{font:700 12px 'Space Grotesk';letter-spacing:.2em;margin-left:4px}
.toast{position:fixed;left:50%;bottom:24px;z-index:5;transform:translate(-50%,150%);opacity:0;background:var(--gold);color:#0b0b0b;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:700;transition:.3s;white-space:nowrap}
.toast.on{transform:translate(-50%,0);opacity:1}
.in{opacity:0;transform:translateY(14px);animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="dust"></canvas>
<div class="wrap">
  <div class="top in">
    <div class="status"><i></i><span data-i="status"></span></div>
    <div class="lang"><button data-l="ru">RU</button><button data-l="uz">UZ</button><button data-l="en">EN</button></div>
  </div>

  <div class="hero">
    <div class="ava in" style="animation-delay:.05s"><div><span class="gold">IH</span></div></div>
    <h1 class="in" style="animation-delay:.12s">Ilhom <span class="gold">Hoshimov</span></h1>
    <div class="role in" style="animation-delay:.18s" data-i="role"></div>
    <div class="loc in" style="animation-delay:.22s"><i class="fa-solid fa-location-dot"></i><span data-i="loc"></span></div>
    <p class="bio in" style="animation-delay:.28s" data-i="bio"></p>
  </div>

  <a class="cta in" style="animation-delay:.34s" id="order" target="_blank" rel="noopener"><i class="fa-brands fa-telegram"></i><span data-i="cta"></span></a>

  <h2 class="in" style="animation-delay:.4s" data-i="h_contacts"></h2>
  <div class="links" id="links"></div>

  <h2 class="in" data-i="h_services"></h2>
  <div class="chips" id="chips"></div>

  <h2 class="in" data-i="h_work"></h2>
  <div class="proj" id="proj"></div>

  <div class="row">
    <button class="save" id="save"><i class="fa-solid fa-user-plus"></i><span data-i="save"></span></button>
    <button class="share" id="share"><i class="fa-solid fa-share-nodes"></i><span data-i="share"></span></button>
  </div>
  <a class="brand" href="../demo/"><span data-i="made"></span><b class="gold">NEXUS CARD</b></a>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== MY DATA ===== */
const ME = {
  name: "Ilhom Hoshimov",
  telegram: "XSH_11",
  instagram: "_xoshimov_21",
  github: "hoshimov-dev",
  site: "https://hoshimov-dev.github.io/",
  email: "xshking001@gmail.com",
  phone: "+998990042724"
};
/* =================== */

const T = {
  ru:{status:"Принимаю заказы",role:"Веб-разработчик · основатель Nexus Card",loc:"Чирчик · Ташкент",
      bio:"Делаю сайты для магазинов с заказами прямо в Telegram и NFC-визитки, которые открываются одним касанием.",
      cta:"Заказать сайт или визитку",h_contacts:"Связь",h_services:"Что я делаю",h_work:"Мои работы",
      tg:"Telegram",ig:"Instagram",gh:"GitHub",site:"Портфолио",mail:"Почта",call:"Позвонить",
      services:[["fa-store","Сайты для магазинов"],["fa-wifi","NFC-визитки"],["fa-paper-plane","Заказы в Telegram"],["fa-cube","3D-сайты"],["fa-mobile-screen","Лендинги"]],
      save:"Сохранить",share:"Поделиться",copied:"Ссылка скопирована ✓",made:"Визитка",
      order:"Здравствуйте, Ильхом! Хочу заказать "},
  uz:{status:"Buyurtma qabul qilaman",role:"Veb-dasturchi · Nexus Card asoschisi",loc:"Chirchiq · Toshkent",
      bio:"Do'konlar uchun buyurtmalari to'g'ridan-to'g'ri Telegramga keladigan saytlar va bir tegishda ochiladigan NFC-vizitkalar yarataman.",
      cta:"Sayt yoki vizitka buyurtma qilish",h_contacts:"Aloqa",h_services:"Nima qilaman",h_work:"Ishlarim",
      tg:"Telegram",ig:"Instagram",gh:"GitHub",site:"Portfolio",mail:"Pochta",call:"Qo'ng'iroq qilish",
      services:[["fa-store","Do'kon saytlari"],["fa-wifi","NFC-vizitkalar"],["fa-paper-plane","Telegram orqali buyurtma"],["fa-cube","3D saytlar"],["fa-mobile-screen","Lendinglar"]],
      save:"Saqlash",share:"Ulashish",copied:"Havola nusxalandi ✓",made:"Vizitka",
      order:"Assalomu alaykum, Ilhom! Buyurtma bermoqchiman: "},
  en:{status:"Open for orders",role:"Web developer · founder of Nexus Card",loc:"Chirchiq · Tashkent",
      bio:"I build shop websites that send orders straight to Telegram, and NFC business cards that open with a single tap.",
      cta:"Order a website or a card",h_contacts:"Contact",h_services:"What I do",h_work:"My work",
      tg:"Telegram",ig:"Instagram",gh:"GitHub",site:"Portfolio",mail:"Email",call:"Call",
      services:[["fa-store","Shop websites"],["fa-wifi","NFC business cards"],["fa-paper-plane","Telegram ordering"],["fa-cube","3D websites"],["fa-mobile-screen","Landing pages"]],
      save:"Save contact",share:"Share",copied:"Link copied ✓",made:"Card by",
      order:"Hi Ilhom! I'd like to order "}
};
const PROJECTS = [
  { url:"../../tosh-3d/", tag:"3D · WebGL", logo:'<b style="font:400 44px UnifrakturMaguntia,serif">Tosh</b>', hue:"#3a3a36",
    t:{ru:["TOSH — 3D-шоурум","Одежда в настоящем 3D"],uz:["TOSH — 3D shourum","Haqiqiy 3D dagi kiyimlar"],en:["TOSH — 3D Showroom","Clothing in real 3D"]} },
  { url:"../../stars-shop.html", tag:"Telegram", logo:'<b class="gold" style="font:800 30px Space Grotesk">★ STARS</b>', hue:"#3b1d8f",
    t:{ru:["Stars Shop","Магазин Telegram Stars"],uz:["Stars Shop","Telegram Stars do'koni"],en:["Stars Shop","Telegram Stars store"]} },
  { url:"../../cavalier-demo/", tag:"Concept", logo:'<b style="font:700 22px Playfair Display;letter-spacing:.3em;color:#d8bd8a">CAVALIER</b>', hue:"#16223a",
    t:{ru:["Cavalier","Магазин мужской одежды"],uz:["Cavalier","Erkaklar kiyimi do'koni"],en:["Cavalier","Menswear store"]} },
  { url:"../demo/", tag:"NFC", logo:'<b class="gold" style="font:700 22px Space Grotesk;letter-spacing:.2em">NEXUS</b>', hue:"#5a3d16",
    t:{ru:["Nexus Card","Пример NFC-визитки"],uz:["Nexus Card","NFC-vizitka namunasi"],en:["Nexus Card","NFC card example"]} }
];

const $ = id => document.getElementById(id);
let lang = (() => { try { return localStorage.getItem('ih_lang') || 'ru'; } catch(e){ return 'ru'; } })();

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = t[el.dataset.i]);
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  $('order').href = `https://t.me/${ME.telegram}?text=${encodeURIComponent(t.order)}`;
  const L = [
    ME.telegram  && { ic:"fa-brands fa-telegram",  bg:"#2aabee", label:t.tg,   sub:"@"+ME.telegram,  href:`https://t.me/${ME.telegram}` },
    ME.instagram && { ic:"fa-brands fa-instagram", bg:"linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)", label:t.ig, sub:"@"+ME.instagram, href:`https://instagram.com/${ME.instagram}` },
    ME.phone     && { ic:"fa-solid fa-phone",      bg:"#34c759", label:t.call, sub:ME.phone,         href:`tel:${ME.phone}` },
    ME.site      && { ic:"fa-solid fa-gem",        bg:"linear-gradient(135deg,#997A15,#D4AF37)", label:t.site, sub:ME.site.replace(/^https?:\/\/|\/$/g,""), href:ME.site },
    ME.github    && { ic:"fa-brands fa-github",    bg:"#24292f", label:t.gh,   sub:ME.github,        href:`https://github.com/${ME.github}` },
    ME.email     && { ic:"fa-solid fa-envelope",   bg:"#004d2d", label:t.mail, sub:ME.email,         href:`mailto:${ME.email}` }
  ].filter(Boolean);
  $('links').innerHTML = L.map((l,i) => `<a class="lnk in" style="animation-delay:${.45+i*.06}s" href="${l.href}"${/^https?:/.test(l.href)?' target="_blank" rel="noopener"':''}>
    <i class="ic ${l.ic}" style="background:${l.bg}"></i><span>${l.label}<small>${l.sub}</small></span><i class="fa-solid fa-arrow-right go"></i></a>`).join('');
  $('chips').innerHTML = t.services.map(([i,s]) => `<span class="chip"><i class="fa-solid ${i}"></i>${s}</span>`).join('');
  $('proj').innerHTML = PROJECTS.map(p => `<a class="pc" href="${p.url}" target="_blank" rel="noopener">
    <div class="cv" style="background:radial-gradient(circle at 50% 35%,${p.hue},#050806 80%)"><em>${p.tag}</em>${p.logo}</div>
    <div class="bd"><h3>${p.t[lang][0]}</h3><p>${p.t[lang][1]}</p></div></a>`).join('');
}

function toast(s){ $('toast').textContent = s; $('toast').classList.add('on'); setTimeout(() => $('toast').classList.remove('on'), 2000); }

document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem('ih_lang', lang); } catch(e){} render(); });

// "Save" hands the phone a vCard, so the contact goes straight into the address book
$('save').onclick = () => {
  const vcf = ['BEGIN:VCARD','VERSION:3.0','N:Hoshimov;Ilhom;;;','FN:'+ME.name,'TITLE:'+T[lang].role,
    ME.phone && 'TEL;TYPE=CELL:'+ME.phone, ME.email && 'EMAIL:'+ME.email,
    'URL:'+ME.site, 'URL:https://t.me/'+ME.telegram, 'URL:https://instagram.com/'+ME.instagram, 'END:VCARD'].filter(Boolean).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([vcf], { type:'text/vcard' }));
  a.download = 'Ilhom_Hoshimov.vcf'; a.click();
};
$('share').onclick = async () => {
  if (navigator.share) { try { await navigator.share({ title: ME.name, url: location.href }); } catch(e){} return; }
  try { await navigator.clipboard.writeText(location.href); toast(T[lang].copied); } catch(e){}
};

// slow floating gold dust in the background
const cv = $('dust'), g = cv.getContext('2d');
let W, H, P = [];
function size(){ W = cv.width = innerWidth*devicePixelRatio; H = cv.height = innerHeight*devicePixelRatio;
  P = Array.from({length:40}, () => ({ x:Math.random()*W, y:Math.random()*H, r:(Math.random()*1.6+.4)*devicePixelRatio, v:(Math.random()*.25+.08)*devicePixelRatio, a:Math.random()*Math.PI*2 })); }
function tick(){ g.clearRect(0,0,W,H);
  for (const p of P){ p.y -= p.v; p.a += .01; if (p.y < -10) { p.y = H+10; p.x = Math.random()*W; }
    g.globalAlpha = .25 + Math.sin(p.a)*.2; g.fillStyle = '#D4AF37'; g.beginPath(); g.arc(p.x + Math.sin(p.a)*8, p.y, p.r, 0, 7); g.fill(); }
  requestAnimationFrame(tick); }
if (!matchMedia('(prefers-reduced-motion: reduce)').matches){ addEventListener('resize', size); size(); tick(); }

render();
</script>
</body>
</html>
